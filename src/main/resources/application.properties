spring.application.name=wallet-service

spring.datasource.username=wallet_user
spring.datasource.password=${DB_PASSWORD:wallet_password}
spring.datasource.url=jdbc:postgresql://localhost:5433/wallet_db
spring.datasource.driver-class-name=org.postgresql.Driver

# HS256 needs >= 32 bytes; set JWT_SECRET in any real environment
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
jwt.expiration=3600000

spring.flyway.enabled=true

# schema is owned by Flyway; fail fast if entities drift from it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
